<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT 3-Zone Color Tracker - Saturado</title>
    <!-- Librería MQTT para Navegador -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            overflow: hidden;
        }
        .container { 
            position: relative; 
            width: 100vw; 
            max-width: 500px; 
            margin: 0 auto; 
        }
        video, canvas { 
            width: 100%; 
            height: auto; 
            display: block; 
        }
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
        }
        #status { 
            padding: 8px; 
            font-weight: bold; 
            background: #222; 
            font-size: 13px; 
            border-bottom: 1px solid #333;
        }
        #preview-bar { 
            width: 100%; 
            height: 40px; 
            display: flex;
            border-bottom: 1px solid #444; 
        }
        .sec-preview {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 0px 0px 4px #000, 0px 0px 4px #000;
            border-right: 1px solid rgba(255,255,255,0.2);
        }
        .sec-preview:last-child {
            border-right: none;
        }
        #brightness-container {
            background: #1a1a1a;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            font-size: 13px;
            font-weight: bold;
        }
        #brightness-slider {
            width: 60%;
            accent-color: #00FFCC;
            cursor: pointer;
        }
        /* BOTÓN DE NAVEGACIÓN ENTRE VERSIONES */
        #nav-link-container {
            background: #1a1a1a;
            padding: 8px 15px;
            border-bottom: 1px solid #333;
        }
        #nav-link {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 8px 12px;
            background: #00FFCC;
            color: #111;
            font-weight: bold;
            font-size: 13px;
            text-decoration: none;
            border-radius: 6px;
        }
        #nav-link:active {
            background: #00cca3;
        }
    </style>
</head>
<body>
    <div id="status">Conectando a Broker MQTT...</div>

    <!-- BOTÓN PARA VOLVER A LA VERSIÓN DE COLORES PUROS -->
    <div id="nav-link-container">
        <a id="nav-link" href="index.html">⬅ Volver a versión Colores Puros</a>
    </div>
    
    <!-- BARRA PREVISUALIZADORA DE LAS 3 SECCIONES -->
    <div id="preview-bar">
        <div id="sec1-prev" class="sec-preview">Sec 1 (0-23)</div>
        <div id="sec2-prev" class="sec-preview">Sec 2 (24-47)</div>
        <div id="sec3-prev" class="sec-preview">Sec 3 (48-71)</div>
    </div>
    
    <!-- CONTROL DE BRILLO GENERAL -->
    <div id="brightness-container">
        <label for="brightness-slider">Brillo: <span id="brightness-val">100</span>%</label>
        <input type="range" id="brightness-slider" min="0" max="100" value="100">
    </div>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output"></canvas>
    </div>

    <script>
        const TOPIC = "sds/dato1";
        const client = mqtt.connect('wss://test.mosquitto.org:8081');

        const statusText = document.getElementById('status');
        const sec1Prev = document.getElementById('sec1-prev');
        const sec2Prev = document.getElementById('sec2-prev');
        const sec3Prev = document.getElementById('sec3-prev');
        const slider = document.getElementById('brightness-slider');
        const brightnessVal = document.getElementById('brightness-val');
        
        let mqttConectado = false;
        let factorBrillo = 1.0;

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            brightnessVal.innerText = val;
            factorBrillo = val / 100;
        });

        client.on('connect', () => {
            mqttConectado = true;
            statusText.innerText = "MQTT Conectado. Esperando cámara...";
        });

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let ultimoPayload = "";

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    statusText.innerText = "Reconociendo 3 zonas de color en tiempo real";
                    requestAnimationFrame(procesarFrame);
                };
            })
            .catch(err => statusText.innerText = "Error accediendo a la cámara: " + err);

        // =====================================================
        // CONVERSIÓN RGB -> HSV -> RGB
        // Permite forzar la SATURACIÓN sin perder el matiz (H) real,
        // así un color pastel o cálido tenue se vuelve vívido sin
        // "saltar" a otro color como pasaba con el amplificador simple.
        // =====================================================
        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const d = max - min;
            let h = 0;

            if (d !== 0) {
                if (max === r) {
                    h = ((g - b) / d) % 6;
                } else if (max === g) {
                    h = (b - r) / d + 2;
                } else {
                    h = (r - g) / d + 4;
                }
                h *= 60;
                if (h < 0) h += 360;
            }

            const s = max === 0 ? 0 : d / max;
            const v = max;
            return [h, s, v];
        }

        function hsvToRgb(h, s, v) {
            const c = v * s;
            const x = c * (1 - Math.abs((h / 60) % 2 - 1));
            const m = v - c;
            let r1 = 0, g1 = 0, b1 = 0;

            if (h < 60)       { r1 = c; g1 = x; b1 = 0; }
            else if (h < 120) { r1 = x; g1 = c; b1 = 0; }
            else if (h < 180) { r1 = 0; g1 = c; b1 = x; }
            else if (h < 240) { r1 = 0; g1 = x; b1 = c; }
            else if (h < 300) { r1 = x; g1 = 0; b1 = c; }
            else              { r1 = c; g1 = 0; b1 = x; }

            return [
                Math.round((r1 + m) * 255),
                Math.round((g1 + m) * 255),
                Math.round((b1 + m) * 255)
            ];
        }

        // UMBRAL DE OSCURIDAD: si el brillo (V) es muy bajo, se considera "apagado" (negro)
        const V_MINIMO = 0.12;      // ~30/255. Ajusta si detecta negro donde no debería (o viceversa)
        const SATURACION_MINIMA = 0.85; // 0 a 1. Entre más alto, más "vívido" se ve un color pastel

        function saturarColorHSV(r, g, b) {
            const [h, s, v] = rgbToHsv(r, g, b);

            if (v < V_MINIMO) {
                return [0, 0, 0];
            }

            // Se conserva el matiz (H) tal cual se detectó -> el color no cambia de identidad
            // Se fuerza la saturación a un mínimo alto -> pasteles/cálidos tenues se vuelven vívidos
            const sFinal = Math.max(s, SATURACION_MINIMA);
            const vFinal = 1.0; // brillo máximo del color puro; el brillo real se aplica después con el slider

            const [rPuro, gPuro, bPuro] = hsvToRgb(h, sFinal, vFinal);

            // Aplicar el slider de brillo general al resultado final
            return [
                Math.round(rPuro * factorBrillo),
                Math.round(gPuro * factorBrillo),
                Math.round(bPuro * factorBrillo)
            ];
        }

        function procesarFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const w = canvas.width;
                const h = canvas.height;
                const secW = w / 3;
                const centerY = Math.floor(h / 2);

                const puntosX = [
                    Math.floor(secW * 0.5),
                    Math.floor(secW * 1.5),
                    Math.floor(secW * 2.5)
                ];

                let colores3Sec = [];

                puntosX.forEach(px => {
                    const sampleRadius = 3;
                    const imgData = ctx.getImageData(px - sampleRadius, centerY - sampleRadius, 7, 7);
                    const data = imgData.data;

                    let sumR = 0, sumG = 0, sumB = 0;
                    for (let i = 0; i < data.length; i += 4) {
                        sumR += data[i];
                        sumG += data[i + 1];
                        sumB += data[i + 2];
                    }

                    const rawR = sumR / (data.length / 4);
                    const rawG = sumG / (data.length / 4);
                    const rawB = sumB / (data.length / 4);

                    // Forzar el color a su versión vívida usando HSV (mantiene el matiz real)
                    // NOTA: ya NO se invierte G/B aquí. El ESP32 (aplicar_3_secciones) ya hace
                    // ese ajuste de cableado internamente, así que aquí se manda RGB normal.
                    const colorSaturado = saturarColorHSV(rawR, rawG, rawB);
                    colores3Sec.push(colorSaturado);
                });

                // DIBUJAR GUÍAS VISUALES EN PANTALLA
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(secW, 0); ctx.lineTo(secW, h);
                ctx.moveTo(secW * 2, 0); ctx.lineTo(secW * 2, h);
                ctx.stroke();

                puntosX.forEach((px, idx) => {
                    ctx.save();
                    ctx.shadowColor = "black";
                    ctx.shadowBlur = 4;
                    ctx.strokeStyle = "#00FFCC";
                    ctx.fillStyle = "#00FFCC";
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    ctx.arc(px, centerY, 8, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(px, centerY, 3, 0, Math.PI * 2);
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fill();

                    ctx.font = "bold 12px sans-serif";
                    ctx.fillText(`Zona ${idx + 1}`, px - 20, centerY - 15);
                    ctx.restore();
                });

                // PREVISUALIZACIÓN EN PANTALLA Y ENVÍO POR MQTT
                const [c1, c2, c3] = colores3Sec;

                sec1Prev.style.backgroundColor = `rgb(${c1[0]}, ${c1[1]}, ${c1[2]})`;
                sec1Prev.innerText = `S1`;

                sec2Prev.style.backgroundColor = `rgb(${c2[0]}, ${c2[1]}, ${c2[2]})`;
                sec2Prev.innerText = `S2`;

                sec3Prev.style.backgroundColor = `rgb(${c3[0]}, ${c3[1]}, ${c3[2]})`;
                sec3Prev.innerText = `S3`;

                const payloadObj = { "Sec1": c1, "Sec2": c2, "Sec3": c3 };
                const payloadStr = JSON.stringify(payloadObj);

                if (payloadStr !== ultimoPayload && mqttConectado) {
                    client.publish(TOPIC, payloadStr);
                    ultimoPayload = payloadStr;
                    statusText.innerText = "Enviando 3 secciones corregidas a ESP32 OK";
                }
            }
            requestAnimationFrame(procesarFrame);
        }
    </script>
</body>
</html>
